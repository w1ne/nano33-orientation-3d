<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Board Orientation</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #0b0e14; font-family: ui-monospace, "SF Mono", Menlo, monospace; color: #e6edf3; overflow: hidden; }
  #scene { position: fixed; inset: 0; }
  #hud {
    position: fixed; top: 16px; left: 16px; padding: 16px 18px;
    background: rgba(15,20,30,.72); border: 1px solid #243044; border-radius: 12px;
    backdrop-filter: blur(8px); min-width: 240px;
  }
  #hud h1 { font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: #7d8da5; margin-bottom: 12px; font-weight: 600; }
  .row { display: flex; justify-content: space-between; gap: 18px; font-size: 14px; line-height: 1.9; }
  .row .k { color: #7d8da5; }
  .row .v { font-variant-numeric: tabular-nums; }
  #status { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; font-size: 13px; }
  #dot { width: 9px; height: 9px; border-radius: 50%; background: #d1495b; transition: background .2s; }
  #dot.on { background: #3ddc84; }
  .stab { margin-top: 14px; }
  .stab .label { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: #7d8da5; margin-bottom: 6px; display: flex; justify-content: space-between; }
  #stabState { font-weight: 700; }
  .bar { height: 8px; border-radius: 6px; background: #1c2536; overflow: hidden; }
  #barFill { height: 100%; width: 0%; background: #3ddc84; transition: width .08s linear, background .2s; }
  #spark { display: block; margin-top: 10px; width: 100%; height: 44px; background: #11161f; border-radius: 8px; }
  #hint { position: fixed; bottom: 16px; left: 16px; font-size: 12px; color: #5a6b85; }
</style>
</head>
<body>
  <div id="scene"></div>
  <div id="hud">
    <h1>Board Orientation</h1>
    <div id="status"><span id="dot"></span><span id="statusText">waiting for board…</span></div>
    <div class="row"><span class="k">Roll</span><span class="v" id="roll">0.0°</span></div>
    <div class="row"><span class="k">Pitch</span><span class="v" id="pitch">0.0°</span></div>
    <div class="row"><span class="k">Yaw</span><span class="v" id="yaw">0.0°</span></div>
    <div class="row"><span class="k">Rate</span><span class="v" id="rate">0.0 °/s</span></div>
    <div class="stab">
      <div class="label"><span>Stability</span><span id="stabState">—</span></div>
      <div class="bar"><div id="barFill"></div></div>
      <canvas id="spark" width="240" height="44"></canvas>
    </div>
  </div>
  <div id="hint">Drag to orbit · scroll to zoom · double-click to reset yaw drift</div>

  <script type="importmap">
  { "imports": { "three": "./three.module.min.js" } }
  </script>
  <script type="module" src="./app.js"></script>
</body>
</html>
